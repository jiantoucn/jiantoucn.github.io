<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Monitor v1.6.3</title>
    <style>
        .nav-back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2000;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 14px;
            transition: all 0.3s;
        }
        .nav-back-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        :root {
            --bg-color: #0f0f0f;
            --panel-bg: rgba(28, 28, 30, 0.85);
            --accent-color: #00a1d6;
            --accent-hover: #00b5e5;
            --border-color: #333;
            --text-color: #fff;
            --text-secondary: #888;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        /* 顶部悬浮胶囊 */
        #control-capsule {
            position: fixed;
            /* Initial pos handled by inline style or JS */
            z-index: 1000;
            display: flex;
            align-items: center;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            padding: 6px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: width 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), height 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), border-radius 0.3s, top 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), left 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            width: 80px; /* 初始宽度，显示图标和声音按钮 */
            height: 40px;
            overflow: hidden;
            cursor: move; /* Changed to move */
            touch-action: none;
        }

        #control-capsule.expanded {
            width: 460px;
            border-radius: 12px;
            padding: 12px;
            height: auto;
            cursor: default;
        }
        
        /* 触发区域，防止鼠标移出太快 */
        #control-capsule::before {
            content: '';
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            z-index: -1;
        }

        /* 胶囊内的图标 */
        #capsule-header {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 52px; /* cover padding */
            display: flex;
            align-items: center;
            padding: 0 10px;
            box-sizing: border-box;
            transition: opacity 0.2s;
        }

        #capsule-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--accent-color);
            margin-right: auto;
        }

        #sound-toggle {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            z-index: 1002;
        }

        #sound-toggle:hover {
            background: rgba(255,255,255,0.2);
        }

        #sound-toggle.muted {
            color: #ff4d4f;
            position: relative;
        }
        
        #control-capsule.expanded #capsule-header {
            opacity: 0;
            pointer-events: none;
        }
        
        /* 展开后的顶部栏 */
        #expanded-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            display: none;
        }

        #control-capsule.expanded #expanded-header {
            display: flex;
        }

        /* 胶囊内的内容 */
        #capsule-content {
            display: flex;
            flex-direction: column;
            width: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s 0.1s;
        }

        #control-capsule.expanded #capsule-content {
            opacity: 1;
            pointer-events: auto;
        }

        .input-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        #input-room {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        #input-room:focus {
            border-color: var(--accent-color);
        }

        #add-btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 0 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        #add-btn:hover {
            background: var(--accent-hover);
        }

        .hint-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
            text-align: center;
        }

        /* History Styles */
        .history-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: block;
        }
        
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
        }
        .history-list::-webkit-scrollbar {
            width: 4px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }
        .history-item {
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
            border: 1px solid transparent;
        }
        .history-item:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.1);
        }
        .history-type {
            opacity: 0.6;
            font-size: 10px;
            text-transform: uppercase;
            background: rgba(0,0,0,0.3);
            padding: 1px 3px;
            border-radius: 2px;
        }
        .history-id {
            color: #eee;
        }
        .history-del {
            margin-left: 2px;
            opacity: 0.3;
            font-weight: bold;
            padding: 0 2px;
        }
        .history-del:hover {
            opacity: 1;
            color: #ff4d4f;
        }

        /* 布局容器 */
        #layout-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .video-row {
            display: flex;
            flex: 1;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .video-box {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            flex-direction: column;
            min-width: 100px;
            min-height: 100px;
            border-right: 1px solid #1a1a1a;
            border-bottom: 1px solid #1a1a1a;
        }
        
        .video-box:last-child {
            border-right: none;
        }

        .video-box iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: auto;
        }
        
        /* 拖拽手柄 */
        .drag-bar {
            height: 12px;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
            cursor: grab;
            transition: background 0.2s;
        }
        
        .video-box:hover .drag-bar {
            background: linear-gradient(to bottom, rgba(0, 161, 214, 0.3), transparent);
        }

        /* 控制按钮 */
        .controls-overlay {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 30;
            pointer-events: auto;
        }

        .video-box:hover .controls-overlay {
            opacity: 1;
        }

        .control-btn {
            background: rgba(0, 0, 0, 0.6);
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        
        .close-btn:hover {
            background: rgba(255, 77, 79, 0.8);
            border-color: rgba(255, 77, 79, 0.8);
        }

        /* Resizers */
        .resizer-row {
            height: 4px;
            background: #000;
            cursor: row-resize;
            z-index: 50;
            transition: background 0.2s;
            flex-shrink: 0;
            position: relative;
        }
        
        .resizer-row:hover, .resizer-row.active {
            background: var(--accent-color);
        }
        
        .resizer-col {
            width: 4px;
            background: #000;
            cursor: col-resize;
            z-index: 50;
            transition: background 0.2s;
            flex-shrink: 0;
            height: 100%;
            position: relative;
        }
        
        .resizer-col:hover, .resizer-col.active {
            background: var(--accent-color);
        }

        /* 空状态 */
        #empty-tip {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #333;
            font-size: 24px;
            font-weight: 300;
            pointer-events: none;
            letter-spacing: 2px;
        }
        
        /* 拖拽样式 */
        .video-box.dragging {
            opacity: 0.4;
            border: 2px dashed var(--accent-color);
        }
        
        .video-box.drag-over {
            border: 2px solid var(--accent-color);
            box-shadow: inset 0 0 20px rgba(0, 161, 214, 0.3);
        }
    </style>
</head>
<body>
    <a href="../index.html" class="nav-back-btn">⬅ 返回导航</a>
    <div id="app">
        <!-- 悬浮胶囊 -->
        <div id="control-capsule" style="top: 10px; left: 50%; transform: translateX(-50%);">
            <div id="capsule-header">
                <div id="capsule-icon">✥</div>
                <div id="sound-toggle" title="全局声音开关 (默认开启)">🔊</div>
            </div>
            
            <div id="capsule-content">
                <div id="expanded-header">
                    <span style="font-size:14px;font-weight:600;color:#fff;">添加直播间</span>
                    <div style="display:flex; gap:10px;">
                        <div id="sound-toggle-expanded" style="cursor:pointer;font-size:16px;">🔊</div>
                    </div>
                </div>
                <div class="input-row">
                    <input type="text" id="input-room" placeholder="支持 B站/YouTube/Twitch (ID或链接)">
                    <button id="add-btn">添加</button>
                </div>
                
                <!-- History Section -->
                <div id="history-section" class="history-section">
                    <div class="history-header">
                        <span>最近访问</span>
                        <span style="cursor:pointer; font-size:10px;" onclick="HistoryManager.clear()">清空</span>
                    </div>
                    <div id="history-list" class="history-list">
                        <!-- Items rendered by JS -->
                    </div>
                </div>

                <div class="hint-text">支持拖拽交换位置 • 拖拽边框调整大小</div>
            </div>
        </div>

        <!-- 布局容器 -->
        <div id="layout-container">
            <div id="empty-tip">Waiting for signal...</div>
            <div id="row-top" class="video-row"></div>
            <div id="row-bottom" class="video-row"></div>
        </div>
    </div>

    <script>
        // 配置
        const MAX_ROOMS = 12;
        const HISTORY_KEY = 'cctv_history_v1';
        let draggedItem = null;
        let isGlobalMuted = false; // 默认开启声音 (Muted = false)

        const HistoryManager = {
            get() {
                try {
                    return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
                } catch(e) { return []; }
            },
            add(info) {
                let list = this.get();
                // Remove duplicate if exists (move to top)
                list = list.filter(item => !(item.type === info.type && item.id === info.id));
                list.unshift({ ...info, time: Date.now() });
                if (list.length > 20) list.pop();
                localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
                this.render();
            },
            remove(type, id, event) {
                if (event) event.stopPropagation();
                let list = this.get();
                list = list.filter(item => !(item.type === type && item.id === id));
                localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
                this.render();
            },
            clear() {
                if(confirm('确定清空历史记录吗？')) {
                    localStorage.removeItem(HISTORY_KEY);
                    this.render();
                }
            },
            render() {
                const list = this.get();
                const container = document.getElementById('history-list');
                if (!container) return;
                
                if (list.length === 0) {
                    container.innerHTML = '<div style="color:#666;font-size:12px;width:100%;text-align:center;padding:10px;">暂无记录</div>';
                    return;
                }

                container.innerHTML = list.map(item => `
                    <div class="history-item" onclick="addVideoBox({type:'${item.type}', id:'${item.id}'})">
                        <span class="history-type">${item.type === 'bilibili' ? 'B站' : item.type}</span>
                        <span class="history-id">${item.id}</span>
                        <span class="history-del" onclick="HistoryManager.remove('${item.type}', '${item.id}', event)" title="删除">×</span>
                    </div>
                `).join('');
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            initCapsule();
            initResizers();
            updateLayoutVisibility();
            initSoundControl();
            HistoryManager.render();
            
            document.getElementById('add-btn').addEventListener('click', handleAddRoom);
            document.getElementById('input-room').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleAddRoom();
            });
            
            // History is always visible
        });

        // ================= UI 交互 =================
        function initCapsule() {
            const capsule = document.getElementById('control-capsule');
            const input = document.getElementById('input-room');
            const soundBtn = document.getElementById('sound-toggle');
            
            // Draggable State
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;
            let dragThreshold = 5;
            let hasMoved = false;

            // Prevent expansion when interacting with sound button
            soundBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleGlobalSound();
            });
            
            // Mouse Down - Start Drag
            capsule.addEventListener('mousedown', (e) => {
                // Ignore if clicking on interactive elements inside
                if (e.target.closest('#capsule-content') || e.target.closest('#sound-toggle')) return;
                
                isDragging = true;
                hasMoved = false;
                startX = e.clientX;
                startY = e.clientY;
                
                const rect = capsule.getBoundingClientRect();
                initialLeft = rect.left;
                initialTop = rect.top;
                
                // Clear transform for absolute positioning
                capsule.style.transform = 'none';
                capsule.style.left = initialLeft + 'px';
                capsule.style.top = initialTop + 'px';
                
                // Prevent text selection
                e.preventDefault();
                
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });

            const onMouseMove = (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                
                if (Math.abs(dx) > dragThreshold || Math.abs(dy) > dragThreshold) {
                    hasMoved = true;
                    capsule.classList.remove('expanded'); // Collapse when dragging starts
                }

                capsule.style.left = (initialLeft + dx) + 'px';
                capsule.style.top = (initialTop + dy) + 'px';
            };

            const onMouseUp = (e) => {
                if (!isDragging) return;
                isDragging = false;
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
                
                if (hasMoved) {
                    snapCapsule();
                } else {
                    // Clicked without moving -> Toggle Expansion
                    toggleCapsuleExpansion();
                }
            };
            
            const toggleCapsuleExpansion = () => {
                if (capsule.classList.contains('expanded')) {
                    capsule.classList.remove('expanded');
                } else {
                    expandCapsule();
                }
            };

            const expandCapsule = () => {
                // Smart Position Check
                const rect = capsule.getBoundingClientRect();
                const expandedWidth = 460;
                const w = window.innerWidth;
                
                // If expanding would go off-screen to the right
                if (rect.left + expandedWidth > w) {
                    let newLeft = w - expandedWidth - 20;
                    if (newLeft < 20) newLeft = 20;
                    capsule.style.left = newLeft + 'px';
                }
                
                capsule.classList.add('expanded');
                setTimeout(() => {
                    if (capsule.classList.contains('expanded')) input.focus();
                }, 300);
            };

            const snapCapsule = () => {
                const rect = capsule.getBoundingClientRect();
                const w = window.innerWidth;
                const h = window.innerHeight;
                const margin = 20;
                
                const distLeft = rect.left;
                const distRight = w - rect.right;
                const distTop = rect.top;
                const distBottom = h - rect.bottom;
                
                const min = Math.min(distLeft, distRight, distTop, distBottom);
                
                if (min === distTop) capsule.style.top = margin + 'px';
                else if (min === distBottom) capsule.style.top = (h - rect.height - margin) + 'px';
                else if (min === distLeft) capsule.style.left = margin + 'px';
                else capsule.style.left = (w - rect.width - margin) + 'px';
            };

            // Expansion Logic - Hover Removed
            // capsule.addEventListener('mouseenter', ...);
            
            capsule.addEventListener('mouseleave', () => {
                if (isDragging) return;
                if (document.activeElement !== input) {
                    capsule.classList.remove('expanded');
                }
            });

            // Click outside to close
            document.addEventListener('click', (e) => {
                if (!capsule.contains(e.target)) {
                    capsule.classList.remove('expanded');
                    hasMoved = false; // Reset drag state flag
                }
            });
        }
        
        function initSoundControl() {
            const btn1 = document.getElementById('sound-toggle');
            const btn2 = document.getElementById('sound-toggle-expanded');
            
            const updateUI = () => {
                const icon = isGlobalMuted ? '🔇' : '🔊';
                const title = isGlobalMuted ? '全局静音中' : '全局声音开启';
                btn1.textContent = icon;
                btn1.title = title;
                btn1.classList.toggle('muted', isGlobalMuted);
                
                btn2.textContent = icon;
                btn2.title = title;
            };
            
            btn2.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleGlobalSound();
            });

            window.toggleGlobalSound = () => {
                isGlobalMuted = !isGlobalMuted;
                updateUI();
                applySoundToAll();
            };
            
            updateUI();
        }

        function applySoundToAll() {
            const boxes = document.querySelectorAll('.video-box');
            boxes.forEach(box => {
                const type = box.getAttribute('data-type');
                const iframe = box.querySelector('iframe');
                if (!iframe) return;

                if (type === 'youtube') {
                    const func = isGlobalMuted ? 'mute' : 'unMute';
                    iframe.contentWindow.postMessage(JSON.stringify({
                        'event': 'command',
                        'func': func,
                        'args': []
                    }), '*');
                } else if (type === 'twitch') {
                    // Twitch: 尝试 postMessage 控制，如果无效则刷新 iframe
                    const msg = {
                        eventName: 'message',
                        params: {
                            method: 'setMuted',
                            args: [isGlobalMuted]
                        }
                    };
                    iframe.contentWindow.postMessage(msg, '*');

                    // 同时也更新 src 以确保状态同步 (虽然会导致重载)
                    let src = iframe.src;
                    const targetMuted = isGlobalMuted ? 'true' : 'false';
                    if (src.includes('muted=')) {
                        const currentMuted = src.match(/muted=(true|false)/)[1];
                        if (currentMuted !== targetMuted) {
                            iframe.src = src.replace(/muted=(true|false)/, `muted=${targetMuted}`);
                        }
                    } else {
                        iframe.src = src + `&muted=${targetMuted}`;
                    }
                } else if (type === 'bilibili') {
                    // Bilibili: 只能通过 reload iframe 更新静音状态
                    let src = iframe.src;
                    const targetMute = isGlobalMuted ? '1' : '0';
                    if (src.includes('mute=')) {
                        const currentMute = src.match(/mute=([01])/)[1];
                        if (currentMute !== targetMute) {
                            iframe.src = src.replace(/mute=[01]/, `mute=${targetMute}`);
                        }
                    } else {
                        iframe.src = src + `&mute=${targetMute}`;
                    }
                }
            });
        }

        // ================= 核心逻辑 =================
        function handleAddRoom() {
            const input = document.getElementById('input-room');
            const val = input.value.trim();
            if (!val) return;

            const info = parseVideoInput(val);
            if (!info) {
                alert('无效的房间号或链接');
                return;
            }

            addVideoBox(info);
            HistoryManager.add(info);
            input.value = '';
            document.getElementById('control-capsule').classList.remove('expanded');
        }

        function parseVideoInput(input) {
            // 1. YouTube
            // https://www.youtube.com/watch?v=VIDEO_ID
            // https://youtu.be/VIDEO_ID
            const ytMatch = input.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
            if (ytMatch) return { type: 'youtube', id: ytMatch[1] };

            // 2. Twitch
            // https://www.twitch.tv/CHANNEL_NAME
            const twitchMatch = input.match(/twitch\.tv\/(\w+)/);
            if (twitchMatch) return { type: 'twitch', id: twitchMatch[1] };
            
            // 3. Bilibili (Existing logic)
            if (/^\d+$/.test(input)) return { type: 'bilibili', id: input };
            
            try {
                let urlStr = input.startsWith('http') ? input : 'https://' + input;
                const url = new URL(urlStr);
                if (url.hostname.includes('bilibili')) {
                    if (url.searchParams.has('roomid')) return { type: 'bilibili', id: url.searchParams.get('roomid') };
                    const parts = url.pathname.split('/');
                    for (let part of parts) {
                        if (/^\d+$/.test(part)) return { type: 'bilibili', id: part };
                    }
                }
            } catch (e) {}
            
            const biliMatch = input.match(/live\.bilibili\.com\/(?:blanc\/)?(\d+)/);
            if (biliMatch) return { type: 'bilibili', id: biliMatch[1] };

            return null;
        }

        function addVideoBox(info) {
            const { type, id } = info;
            const uniqueId = `${type}:${id}`; // Use composite ID for uniqueness check if needed
            
            const topRow = document.getElementById('row-top');
            const bottomRow = document.getElementById('row-bottom');
            const topCount = topRow.querySelectorAll('.video-box').length;
            const bottomCount = bottomRow.querySelectorAll('.video-box').length;
            
            if (topCount + bottomCount >= MAX_ROOMS) {
                alert(`已达到最大窗口限制 (${MAX_ROOMS})`);
                return;
            }
            
            // Check existence
            if (document.querySelector(`.video-box[data-unique-id="${uniqueId}"]`)) {
                alert('该直播间已存在');
                return;
            }

            // 布局策略：上多下少
            let targetRow = (bottomCount < topCount) ? bottomRow : topRow;
            if (topCount + bottomCount === 0) targetRow = topRow;

            const box = createBoxElement(info, uniqueId);
            targetRow.appendChild(box);
            refreshResizersInRow(targetRow);
            updateLayoutVisibility();
        }

        function createBoxElement(info, uniqueId) {
            const { type, id } = info;
            const div = document.createElement('div');
            div.className = 'video-box';
            div.setAttribute('data-unique-id', uniqueId);
            div.setAttribute('data-type', type);
            div.draggable = true;
            
            div.addEventListener('dragstart', handleDragStart);
            div.addEventListener('dragover', handleDragOver);
            div.addEventListener('drop', handleDrop);
            div.addEventListener('dragend', handleDragEnd);

            let src = '';
            // 构造 URL 时根据当前声音设置决定参数
            // 注意：浏览器自动播放策略可能阻止带声音的自动播放
            
            if (type === 'bilibili') {
                // B站参数: autoplay=1 (自动播放), mute=0/1 (静音)
                // 如果 isGlobalMuted=false (声音开启), 尝试 mute=0
                const muteParam = isGlobalMuted ? '&mute=1' : '&mute=0';
                src = `https://www.bilibili.com/blackboard/live/live-activity-player.html?enterTheRoom=0&cid=${id}&autoplay=1${muteParam}`;
            } else if (type === 'youtube') {
                // YouTube: autoplay=1, mute=1 (强制静音才容易自动播放), enablejsapi=1 (允许JS控制)
                // 如果用户希望默认开启声音，我们尝试不加 mute=1，但可能会被浏览器阻止自动播放
                // 为了兼容性，如果 isGlobalMuted=true，我们加 mute=1
                const muteParam = isGlobalMuted ? '&mute=1' : ''; 
                src = `https://www.youtube.com/embed/${id}?autoplay=1&enablejsapi=1${muteParam}`;
            } else if (type === 'twitch') {
                // Twitch: parent 必须严格匹配当前域名
                // 为了兼容本地环境(localhost/127.0.0.1)和部署环境，我们将常见域名都加上
                const parents = new Set(['localhost', '127.0.0.1']);
                if (window.location.hostname) {
                    parents.add(window.location.hostname);
                }
                
                const parentParams = Array.from(parents).map(p => `&parent=${p}`).join('');
                const muted = isGlobalMuted ? 'true' : 'false';
                
                src = `https://player.twitch.tv/?channel=${id}${parentParams}&autoplay=true&muted=${muted}`;
            }

            div.innerHTML = `
                <div class="drag-bar" title="拖拽移动"></div>
                <iframe src="${src}" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
                <div class="controls-overlay">
                    <div class="control-btn close-btn" onclick="removeBox(this)" title="关闭">×</div>
                </div>
            `;
            return div;
        }

        window.removeBox = (btn) => {
            const box = btn.closest('.video-box');
            const row = box.parentElement;
            row.removeChild(box);
            refreshResizersInRow(row);
            updateLayoutVisibility();
        };

        function updateLayoutVisibility() {
            const topRow = document.getElementById('row-top');
            const bottomRow = document.getElementById('row-bottom');
            const topCount = topRow.querySelectorAll('.video-box').length;
            const bottomCount = bottomRow.querySelectorAll('.video-box').length;
            const emptyTip = document.getElementById('empty-tip');
            
            let rowResizer = document.getElementById('row-resizer');
            if (!rowResizer) {
                rowResizer = document.createElement('div');
                rowResizer.id = 'row-resizer';
                rowResizer.className = 'resizer-row';
                topRow.after(rowResizer);
                initRowResizer(rowResizer);
            }

            if (topCount === 0 && bottomCount === 0) {
                emptyTip.style.display = 'block';
                topRow.style.display = 'none';
                bottomRow.style.display = 'none';
                rowResizer.style.display = 'none';
            } else if (bottomCount === 0) {
                emptyTip.style.display = 'none';
                topRow.style.display = 'flex';
                topRow.style.height = '100%';
                bottomRow.style.display = 'none';
                rowResizer.style.display = 'none';
            } else if (topCount === 0) {
                emptyTip.style.display = 'none';
                topRow.style.display = 'none';
                bottomRow.style.display = 'flex';
                bottomRow.style.height = '100%';
                rowResizer.style.display = 'none';
            } else {
                emptyTip.style.display = 'none';
                topRow.style.display = 'flex';
                bottomRow.style.display = 'flex';
                rowResizer.style.display = 'block';
                // Reset to 50/50 if previously full
                if (topRow.style.height === '100%') topRow.style.height = '50%';
                if (bottomRow.style.height === '100%') bottomRow.style.height = '50%';
            }
        }

        // ================= 布局调整 (Resizer & Swap) =================
        function initResizers() {
            // Placeholder for global init if needed
        }

        function refreshResizersInRow(row) {
            row.querySelectorAll('.resizer-col').forEach(r => r.remove());
            const boxes = Array.from(row.querySelectorAll('.video-box'));
            if (boxes.length < 2) return;

            for (let i = 0; i < boxes.length - 1; i++) {
                const resizer = document.createElement('div');
                resizer.className = 'resizer-col';
                initColResizer(resizer, boxes[i], boxes[i+1]);
                boxes[i].after(resizer);
            }
        }

        function initRowResizer(resizer) {
            let startY, startH1, startH2;
            const row1 = document.getElementById('row-top');
            const row2 = document.getElementById('row-bottom');

            const onMouseDown = (e) => {
                startY = e.clientY;
                startH1 = row1.getBoundingClientRect().height;
                startH2 = row2.getBoundingClientRect().height;
                resizer.classList.add('active');
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
                toggleIframes(false);
            };

            const onMouseMove = (e) => {
                const dy = e.clientY - startY;
                const containerH = document.getElementById('layout-container').clientHeight;
                const p1 = ((startH1 + dy) / containerH) * 100;
                const p2 = ((startH2 - dy) / containerH) * 100;
                
                if (p1 > 10 && p2 > 10) {
                    row1.style.height = `${p1}%`;
                    row2.style.height = `${p2}%`;
                }
            };

            const onMouseUp = () => {
                resizer.classList.remove('active');
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
                toggleIframes(true);
            };

            resizer.addEventListener('mousedown', onMouseDown);
        }

        function initColResizer(resizer, box1, box2) {
            let startX, w1, w2;

            const onMouseDown = (e) => {
                startX = e.clientX;
                w1 = box1.getBoundingClientRect().width;
                w2 = box2.getBoundingClientRect().width;
                resizer.classList.add('active');
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
                toggleIframes(false);
            };

            const onMouseMove = (e) => {
                const dx = e.clientX - startX;
                box1.style.flex = `${w1 + dx}`;
                box2.style.flex = `${w2 - dx}`;
            };

            const onMouseUp = () => {
                resizer.classList.remove('active');
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
                toggleIframes(true);
            };

            resizer.addEventListener('mousedown', onMouseDown);
        }

        function toggleIframes(enable) {
            document.querySelectorAll('iframe').forEach(f => f.style.pointerEvents = enable ? 'auto' : 'none');
        }

        // ================= 拖拽逻辑 =================
        function handleDragStart(e) {
            draggedItem = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            e.preventDefault();
            this.classList.add('drag-over');
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            if (draggedItem && draggedItem !== this) {
                // Swap DOM
                const parent1 = draggedItem.parentNode;
                const parent2 = this.parentNode;
                
                const placeholder = document.createElement('div');
                parent1.insertBefore(placeholder, draggedItem);
                parent2.insertBefore(draggedItem, this);
                parent1.insertBefore(this, placeholder);
                parent1.removeChild(placeholder);
                
                refreshResizersInRow(parent1);
                if (parent1 !== parent2) refreshResizersInRow(parent2);
            }
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            document.querySelectorAll('.video-box').forEach(el => el.classList.remove('drag-over'));
            draggedItem = null;
        }
    </script>
